[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kakure"
version = "0.1.0"
description = "Translate ASMR Japanese voice audio into bilingual voice audio by overlaying a Chinese voice track"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kakure Contributors"}]
keywords = ["asmr", "translation", "bilingual", "tts", "whisper", "japanese", "chinese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "pydub>=0.25.1",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "tomlkit>=0.12.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "soundfile>=0.12.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]
kotoba = [
    "transformers>=4.39.0",
    "accelerate>=0.20.0",
    "torchaudio>=2.0.0",
]
indextts = [
    "indextts2-inference>=2.0.0",
]
demucs = [
    "demucs>=4.1.0",
]

[project.scripts]
kakure = "kakure.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"