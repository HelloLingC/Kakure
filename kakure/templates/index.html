<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kakure - ASMR Bilingual Voice Overlay</title>
<script src="/static/vendor/tailwind.js"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<script>
(function () {
  var m = localStorage.getItem('kakure.theme') || 'auto';
  var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.classList.add('dark');
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
})();
</script>
<script src="/static/i18n.js?v={{ i18n_version }}"></script>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.store('theme', {
    mode: localStorage.getItem('kakure.theme') || 'auto',
    init() {
      this.apply();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (this.mode === 'auto') this.apply(); });
    },
    isDark() {
      return this.mode === 'dark' || (this.mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    },
    apply() {
      document.documentElement.classList.toggle('dark', this.isDark());
      document.documentElement.style.colorScheme = this.isDark() ? 'dark' : 'light';
    },
    set(mode) {
      this.mode = mode;
      localStorage.setItem('kakure.theme', mode);
      this.apply();
    },
    cycle() {
      const order = ['light', 'dark', 'auto'];
      this.set(order[(order.indexOf(this.mode) + 1) % order.length]);
    },
    label() { return Alpine.store('i18n').t('theme.' + this.mode); }
  });
  Alpine.store('i18n', {
    lang: localStorage.getItem('kakure.lang') || 'en',
    t(key, vars) {
      let s = (I18N_STRINGS[this.lang] || I18N_STRINGS.en)[key];
      if (s === undefined) s = key;
      if (vars) {
        for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(String(v));
      }
      return s;
    },
    toggle() {
      this.lang = this.lang === 'en' ? 'zh' : 'en';
      localStorage.setItem('kakure.lang', this.lang);
      document.documentElement.lang = this.lang;
    },
    init() { document.documentElement.lang = this.lang; }
  });
});
</script>
<script defer src="/static/vendor/alpine.js"></script>
<style>
  @keyframes kakure-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
    50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.08); }
  }
  .stage-running { animation: kakure-pulse 2s ease-in-out infinite; }
  [x-cloak] { display: none !important; }
  .file-drop-zone.dragover { border-color: #3b82f6; background: #eff6ff; }
  .dark .file-drop-zone.dragover { background: #172554; }
  body { transition: background-color 0.3s ease; }
</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen font-sans antialiased"
      x-data="{ activeTab: 'process', ffmpegOk: true, healthChecked: false }"
      x-init="fetch('/api/health').then(r => r.json()).then(d => { ffmpegOk = d.ffmpeg !== false; healthChecked = true; }).catch(() => healthChecked = true)"
      x-cloak>

<svg xmlns="http://www.w3.org/2000/svg" class="hidden" aria-hidden="true">
  <symbol id="icon-microphone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/>
  </symbol>
  <symbol id="icon-language" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.5 21l5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 016-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 01-3.827-5.802"/>
  </symbol>
  <symbol id="icon-speaker-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"/>
  </symbol>
  <symbol id="icon-musical-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z"/>
  </symbol>
  <symbol id="icon-adjustments-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"/>
  </symbol>
  <symbol id="icon-arrow-down-tray" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
  </symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </symbol>
  <symbol id="icon-archive-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/>
  </symbol>
  <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </symbol>
  <symbol id="icon-x-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </symbol>
  <symbol id="icon-spinner" viewBox="0 0 24 24" fill="none">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
  </symbol>
</svg>

<div class="max-w-4xl mx-auto px-4 py-6">

  <!-- Header -->
  <header class="mb-6 flex items-start justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100">Kakure</h1>
      <p class="text-gray-500 dark:text-gray-400 mt-1" x-text="$store.i18n.t('app.subtitle')"></p>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" @click="$store.theme.cycle()"
              :title="$store.i18n.t('theme.toggle')"
              class="shrink-0 px-3 py-1.5 rounded-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer">
        <svg x-show="$store.theme.mode === 'light'" class="inline-block h-4 w-4 -mt-0.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
        <svg x-show="$store.theme.mode === 'dark'" class="inline-block h-4 w-4 -mt-0.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
        <svg x-show="$store.theme.mode === 'auto'" class="inline-block h-4 w-4 -mt-0.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><use href="#icon-adjustments-horizontal"></use></svg>
        <span x-text="$store.theme.label()"></span>
      </button>
      <button type="button" @click="$store.i18n.toggle()"
              class="shrink-0 px-3 py-1.5 rounded-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer"
              x-text="$store.i18n.t('lang.toggle')"></button>
    </div>
  </header>

  <!-- ffmpeg warning banner -->
  <div x-show="ffmpegOk === false" x-cloak
       class="mb-6 p-3 bg-amber-50 dark:bg-amber-900/30 text-amber-800 dark:text-amber-300 rounded-md border border-amber-200 dark:border-amber-800 text-sm">
    <span class="font-medium" x-text="$store.i18n.t('ffmpeg.title')"></span>
    <span x-text="$store.i18n.t('ffmpeg.warn1')"></span>
    <a class="underline font-medium" href="https://ffmpeg.org/download.html" target="_blank" rel="noopener">ffmpeg.org</a>
    <span x-text="$store.i18n.t('ffmpeg.warn2')"></span>
    <button type="button" @click="ffmpegOk = true"
            class="ml-2 text-amber-700 dark:text-amber-300 hover:text-amber-900 dark:hover:text-amber-100 underline cursor-pointer"
            x-text="$store.i18n.t('ffmpeg.dismiss')"></button>
  </div>

  <!-- Tab Nav (Material Design 3 primary tabs) -->
  <nav class="flex items-stretch mb-6 border-b border-gray-200 dark:border-gray-700" role="tablist" aria-label="Tabs">
    <button @click="activeTab = 'process'" type="button" role="tab"
      :aria-selected="activeTab === 'process'"
      class="relative flex-1 px-5 h-12 font-medium text-sm tracking-wide transition-colors cursor-pointer"
      :class="activeTab === 'process' ? 'text-gray-900 dark:text-gray-100' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'">
      <span x-text="$store.i18n.t('tab.process')"></span>
      <span aria-hidden="true"
        class="absolute inset-x-0 bottom-0 mx-auto w-16 h-[3px] rounded-full transition-colors"
        :class="activeTab === 'process' ? 'bg-blue-600 dark:bg-blue-400' : 'bg-transparent'"></span>
    </button>
    <button @click="activeTab = 'settings'" type="button" role="tab"
      :aria-selected="activeTab === 'settings'"
      class="relative flex-1 px-5 h-12 font-medium text-sm tracking-wide transition-colors cursor-pointer"
      :class="activeTab === 'settings' ? 'text-gray-900 dark:text-gray-100' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'">
      <span x-text="$store.i18n.t('tab.settings')"></span>
      <span aria-hidden="true"
        class="absolute inset-x-0 bottom-0 mx-auto w-16 h-[3px] rounded-full transition-colors"
        :class="activeTab === 'settings' ? 'bg-blue-600 dark:bg-blue-400' : 'bg-transparent'"></span>
    </button>
    <button @click="activeTab = 'models'" type="button" role="tab"
      :aria-selected="activeTab === 'models'"
      class="relative flex-1 px-5 h-12 font-medium text-sm tracking-wide transition-colors cursor-pointer"
      :class="activeTab === 'models' ? 'text-gray-900 dark:text-gray-100' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'">
      <span x-text="$store.i18n.t('tab.models')"></span>
      <span aria-hidden="true"
        class="absolute inset-x-0 bottom-0 mx-auto w-16 h-[3px] rounded-full transition-colors"
        :class="activeTab === 'models' ? 'bg-blue-600 dark:bg-blue-400' : 'bg-transparent'"></span>
    </button>
  </nav>

  <!-- ================================================================ -->
  <!-- PROCESS TAB                                                        -->
  <!-- ================================================================ -->
  <div x-show="activeTab === 'process'" x-data="processTab()" x-cloak>

    <form @submit.prevent="start" enctype="multipart/form-data"
          class="mb-6 p-6 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm">
      <!-- Input source toggle: local path (default) vs upload file -->
      <div class="flex gap-2 mb-4">
        <button type="button" @click="inputMode = 'path'"
                :class="inputMode === 'path' ? 'bg-blue-600 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600'"
                class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors cursor-pointer"
                x-text="$store.i18n.t('process.input_path')"></button>
        <button type="button" @click="inputMode = 'upload'"
                :class="inputMode === 'upload' ? 'bg-blue-600 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600'"
                class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors cursor-pointer"
                x-text="$store.i18n.t('process.input_upload')"></button>
      </div>

      <!-- Local path mode (default): folder + load + file list -->
      <template x-if="inputMode === 'path'">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-2" x-text="$store.i18n.t('process.path_label')"></label>
          <div class="flex items-center gap-3">
            <input type="text" name="local_path" x-model="localPath"
                   :placeholder="$store.i18n.t('process.path_placeholder')"
                   class="block w-full text-sm rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-3 py-2 text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                   :disabled="uploading">
            <button type="button" @click="loadFolder"
                    class="shrink-0 px-6 py-2 bg-gray-600 dark:bg-gray-700 text-white rounded-md text-sm font-medium
                           hover:bg-gray-700 dark:hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed
                           transition-colors cursor-pointer"
                    :disabled="uploading || !localPath.trim()">
              <span x-text="$store.i18n.t('process.load_button')"></span>
            </button>
          </div>
          <label class="mt-2 flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 cursor-pointer">
            <input type="checkbox" x-model="recursive" class="rounded" :disabled="uploading">
            <span x-text="$store.i18n.t('process.path_recursive')"></span>
          </label>
          <p class="mt-1 text-xs text-gray-400 dark:text-gray-500" x-text="$store.i18n.t('process.path_hint')"></p>

          <!-- Loaded file list -->
          <div x-show="folderFiles.length" class="mt-4">
            <div class="flex items-center justify-between gap-3 mb-2">
              <p class="text-sm font-medium text-gray-600 dark:text-gray-300">
                <span x-text="$store.i18n.t('process.folder_files', {n: folderFiles.length})"></span>
              </p>
              <button type="button" @click="processBatch"
                      class="shrink-0 px-5 py-2 bg-blue-600 text-white rounded-md text-sm font-medium
                             hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed
                             transition-colors cursor-pointer"
                      :disabled="uploading || !folderFiles.length">
                <span x-text="$store.i18n.t('process.batch_button')"></span>
              </button>
            </div>
            <ul class="divide-y divide-gray-100 dark:divide-gray-700 border border-gray-200 dark:border-gray-700 rounded-lg max-h-72 overflow-y-auto bg-white dark:bg-gray-800">
              <template x-for="(f, i) in folderFiles" :key="f.path">
                <li class="flex items-center gap-3 px-3 py-2 text-sm">
                  <svg class="w-4 h-4 shrink-0 text-gray-400 dark:text-gray-500"><use href="#icon-speaker-wave"></use></svg>
                  <span class="flex-1 min-w-0">
                    <span class="block truncate text-gray-800 dark:text-gray-100" x-text="f.name"></span>
                    <span class="text-xs text-gray-400 dark:text-gray-500 flex items-center gap-2">
                      <span x-text="fmtSize(f.size)"></span>
                      <template x-if="f.duration_seconds">
                        <span class="inline-flex items-center gap-0.5">
                          <svg class="w-3.5 h-3.5"><use href="#icon-clock"></use></svg>
                          <span x-text="fmtDuration(f.duration_seconds)"></span>
                        </span>
                      </template>
                    </span>
                  </span>
                  <button type="button" @click="processSingle(f.path)"
                          class="shrink-0 px-3 py-1.5 rounded-md text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300
                                 hover:bg-gray-200 dark:hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors cursor-pointer"
                          :disabled="uploading">
                    <span x-text="$store.i18n.t('process.process_file')"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
          <p x-show="folderError" class="mt-2 text-xs text-red-500" x-text="folderError"></p>
        </div>
      </template>

      <!-- Upload mode -->
      <template x-if="inputMode === 'upload'">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-2" x-text="$store.i18n.t('process.upload_label')"></label>
          <div class="flex items-center gap-3">
            <input type="file" name="file" accept="audio/*" required
                   @change="onFileSelected($event)"
                   class="block w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4
                          file:rounded-md file:border-0 file:text-sm file:font-medium
                          file:bg-blue-50 dark:file:bg-blue-900/40 file:text-blue-700 dark:file:text-blue-300 hover:file:bg-blue-100 dark:hover:file:bg-blue-900/60
                          cursor-pointer" :disabled="uploading">
            <button type="submit"
                    class="shrink-0 px-6 py-2 bg-blue-600 text-white rounded-md text-sm font-medium
                           hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed
                           transition-colors cursor-pointer"
                    :disabled="uploading">
              <span x-show="!uploading" x-text="$store.i18n.t('process.button')"></span>
              <span x-show="uploading" class="inline-flex items-center gap-1">
                <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                <span x-text="$store.i18n.t('process.uploading')"></span>
              </span>
            </button>
          </div>
          <p x-show="selectedFile" class="mt-2 text-xs text-gray-500 dark:text-gray-400 space-y-0.5">
            <span class="flex items-center gap-2 flex-wrap">
              <span x-text="selectedFile.name"></span>
              <span class="inline-flex items-center gap-0.5 font-medium text-gray-600 dark:text-gray-300" x-show="selectedFile.duration">
                <svg class="w-3.5 h-3.5"><use href="#icon-clock"></use></svg>
                <span x-text="fmtDuration(selectedFile.duration)"></span>
              </span>
            </span>
            <span class="flex items-center gap-2 flex-wrap">
              <span x-text="$store.i18n.t('process.file_type') + ': ' + (selectedFile.type || 'unknown')"></span>
              <span>·</span>
              <span x-text="$store.i18n.t('process.file_size') + ': ' + fmtSize(selectedFile.size)"></span>
              <span>·</span>
              <span x-text="$store.i18n.t('process.file_modified') + ': ' + fmtDate(selectedFile.lastModified)"></span>
            </span>
          </p>
        </div>
      </template>
    </form>

    <p class="text-xs text-gray-400 dark:text-gray-500 mb-4" x-text="$store.i18n.t('process.hint')"></p>

    <!-- Batch progress (local path folder mode) -->
    <div x-show="batch" class="mb-4 p-4 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm">
      <div class="flex items-center justify-between gap-3 mb-2">
        <p class="text-sm font-medium text-gray-700 dark:text-gray-200" x-text="$store.i18n.t('process.batch_progress', {cur: batchIndex, total: batchTotal})"></p>
        <p class="text-xs text-gray-400 dark:text-gray-500 truncate" x-text="batchFile"></p>
      </div>
      <div class="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-2.5">
        <div class="bg-blue-600 dark:bg-blue-400 h-2.5 rounded-full transition-all duration-300" :style="'width: ' + (batchTotal ? (batchIndex / batchTotal * 100) : 0) + '%'"></div>
      </div>
      <p x-show="batchError" class="mt-2 text-xs text-red-500" x-text="batchError"></p>
    </div>

    <!-- Pipeline flow diagram -->
    <div class="mb-4 p-4 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm">
      <div class="flex items-center gap-2 flex-wrap">
        <template x-for="(stage, i) in stages" :key="stage.id">
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-2 px-3 py-2 rounded-lg border-2 min-w-[110px] transition-all duration-300"
                 :class="{
                   'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900': stage.status === 'pending',
                   'border-blue-500 dark:border-blue-500 bg-blue-50 dark:bg-blue-950 stage-running': stage.status === 'running',
                   'border-green-500 dark:border-green-500 bg-green-50 dark:bg-green-950': stage.status === 'completed',
                   'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 border-dashed': stage.status === 'skipped',
                   'border-red-500 dark:border-red-500 bg-red-50 dark:bg-red-950': stage.status === 'error',
                 }">
              <svg class="w-5 h-5 shrink-0"
                   :class="{
                     'text-gray-400 dark:text-gray-500': stage.status === 'pending',
                     'text-blue-600 dark:text-blue-400': stage.status === 'running',
                     'text-green-600 dark:text-green-400': stage.status === 'completed',
                     'text-gray-300 dark:text-gray-600': stage.status === 'skipped',
                     'text-red-600 dark:text-red-400': stage.status === 'error',
                   }">
                <use :href="'#icon-' + stage.icon"></use>
              </svg>
              <div>
                <div class="font-semibold text-xs"
                     :class="{
                       'text-gray-500 dark:text-gray-400': stage.status === 'pending',
                       'text-blue-700 dark:text-blue-300': stage.status === 'running',
                       'text-green-700 dark:text-green-300': stage.status === 'completed',
                       'text-gray-400 dark:text-gray-500': stage.status === 'skipped',
                       'text-red-700 dark:text-red-300': stage.status === 'error',
                     }" x-text="stageName(stage)"></div>
                <div class="text-[11px]"
                     :class="{
                       'text-gray-400 dark:text-gray-500': stage.status === 'pending',
                       'text-blue-500 dark:text-blue-400': stage.status === 'running',
                       'text-green-600 dark:text-green-400': stage.status === 'completed',
                       'text-gray-300 dark:text-gray-600': stage.status === 'skipped',
                       'text-red-500 dark:text-red-400': stage.status === 'error',

              </div>

              <svg x-show="stage.status === 'error'" class="w-4 h-4 text-red-600 dark:text-red-400 shrink-0"><use href="#icon-x-circle"></use></svg>
            </div>
            <span x-show="i < stages.length - 1" class="text-gray-300 dark:text-gray-600 text-xl font-light">›</span>
          </div>
        </template>
      </div>
    </div>

    <!-- Status / Error -->

      </span>
    </div>

            <tr>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase" x-text="$store.i18n.t('process.col.id')"></th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase" x-text="$store.i18n.t('process.col.start')"></th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase" x-text="$store.i18n.t('process.col.end')"></th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase" x-text="$store.i18n.t('process.col.japanese')"></th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase" x-text="$store.i18n.t('process.col.chinese')"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
            <template x-for="seg in segments" :key="seg.id">

                <td class="px-3 py-2 text-gray-600 dark:text-gray-400" x-text="seg.id"></td>
                <td class="px-3 py-2 text-gray-600 dark:text-gray-400" x-text="seg.start.toFixed(2)"></td>
                <td class="px-3 py-2 text-gray-600 dark:text-gray-400" x-text="seg.end.toFixed(2)"></td>
                <td class="px-3 py-2 text-gray-800 dark:text-gray-100 max-w-md" x-text="seg.original_text"></td>
                <td class="px-3 py-2 text-gray-800 dark:text-gray-100 max-w-md" x-text="seg.translated_text"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Results -->
    <div x-show="completed" class="space-y-4" x-transition>
      <div class="p-4 bg-green-50 dark:bg-green-900/30 rounded-md border border-green-200 dark:border-green-800">

            </span>

        <a :href="'/api/process/' + jobId + '/srt_zh'"

<script>
function processTab() {
  return {
    jobId: null,
    stages: {{ pipeline_stages_json | safe }}.map(s => ({...s, status: 'pending'})),
    statusMessage: '',
    error: null,
    completed: false,
    result: null,
    segments: [],
    stageLog: [],
    asrDone: false,
    translateDone: false,
    uploading: false,
    selectedFile: null,
    elapsed: 0,
    inputMode: 'path',
    localPath: '',
    recursive: false,
    folderFiles: [],
    folderError: '',
    batch: false,
    batchIndex: 0,
    batchTotal: 0,
    batchFile: '',
    batchError: '',
    _stageOrder: null,
    _es: null,
    _timer: null,

    init() {
      this._stageOrder = this.stages.map(s => s.id);
    },

    stageName(stage) { return this.$store.i18n.t('stage.' + stage.id + '.name'); },
    stageDesc(stage) { return this.$store.i18n.t('stage.' + stage.id + '.desc'); },

    fmtSize(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + units[i];
    },

    fmtDuration(seconds) {
      if (!isFinite(seconds)) return '--:--';
      const h = Math.floor(seconds / 3600);
      const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const s = String(Math.floor(seconds % 60)).padStart(2, '0');
      return (h > 0 ? h + ':' : '') + m + ':' + s;
    },

    fmtDate(ms) {
      if (!ms) return '--';
      const d = new Date(ms);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    },

    onFileSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) { this.selectedFile = null; return; }
      this.selectedFile = { name: file.name, size: file.size, type: file.type, lastModified: file.lastModified, duration: null };
      const url = URL.createObjectURL(file);
      const audio = new Audio();
      const cleanup = () => { URL.revokeObjectURL(url); audio.removeAttribute('src'); };
      audio.addEventListener('loadedmetadata', () => {
        this.selectedFile.duration = audio.duration;
        cleanup();
      }, { once: true });
      audio.addEventListener('error', () => { cleanup(); }, { once: true });
      audio.preload = 'metadata';
      audio.src = url;
    },

    formatElapsed() {
      const s = Math.floor(this.elapsed);
      const h = Math.floor(s / 3600);
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return h > 0 ? h + ':' + m + ':' + sec : m + ':' + sec;
    },

    _stopTimer() {
      if (this._timer) { clearInterval(this._timer); this._timer = null; }
    },

    async loadFolder() {
      this.folderError = '';
      if (!this.localPath.trim()) { this.folderError = this.$store.i18n.t('error.missing_path'); return; }
      try {
        const res = await fetch('/api/process/path/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: this.localPath.trim(), recursive: this.recursive })
        });
        if (!res.ok) throw new Error((await res.json()).detail || this.$store.i18n.t('error.load_failed'));
        const data = await res.json();
        this.folderFiles = data.files || [];
      } catch (e) { this.folderError = e.message; this.folderFiles = []; }
    },

    async _submit(body) {
      this.uploading = true; this.error = null; this.completed = false;
      this.result = null; this.segments = [];
      this.stageLog = [];
      this.asrDone = false; this.translateDone = false;
      this.elapsed = 0;
      this.selectedFile = null;
      this.batch = false; this.batchIndex = 0; this.batchTotal = 0; this.batchFile = ''; this.batchError = '';
      this.stages = this.stages.map(s => ({...s, status: 'pending'}));
      this.statusMessage = '';
      try {
        const res = await fetch('/api/process/path', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error((await res.json()).detail || this.$store.i18n.t('error.upload_failed'));
        const { job_id } = await res.json();
        this.jobId = job_id;
      } catch (e) { this.error = e.message; this.uploading = false; return; }
      this.uploading = false;
      this.connectSSE();
    },

    processSingle(filePath) {
      this._submit({ path: filePath });
    },

    processBatch() {
      if (!this.folderFiles.length) return;
      this._submit({ paths: this.folderFiles.map(f => f.path) });
    },

    async start(event) {
      if (this.inputMode === 'upload') {
        this.uploading = true; this.error = null; this.completed = false;
        this.result = null; this.segments = [];
        this.stageLog = [];
        this.asrDone = false; this.translateDone = false;
        this.elapsed = 0;
        this.selectedFile = null;
        this.batch = false; this.batchIndex = 0; this.batchTotal = 0; this.batchFile = ''; this.batchError = '';
        this.stages = this.stages.map(s => ({...s, status: 'pending'}));
        this.statusMessage = '';
        const formData = new FormData(event.target);
        try {
          const res = await fetch('/api/process', { method: 'POST', body: formData });
          if (!res.ok) throw new Error((await res.json()).detail || this.$store.i18n.t('error.upload_failed'));
          const { job_id } = await res.json();
          this.jobId = job_id;
        } catch (e) { this.error = e.message; this.uploading = false; return; }
        this.uploading = false;
        this.connectSSE();
      }
    },

    connectSSE() {
      if (this._es) this._es.close();
      const es = new EventSource('/api/process/' + this.jobId);
      this._es = es;
      this.elapsed = 0;
      this._timer = setInterval(() => { this.elapsed++; }, 1000);
      es.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'heartbeat') return;
        if (d.type === 'batch') {
          this.batch = true;
          this.batchIndex = d.index;
          this.batchTotal = d.total;
          this.batchFile = d.file || '';
          if (d.status === 'running') this.batchError = '';
          if (d.status === 'error') this.batchError = d.message || this.$store.i18n.t('error.upload_failed');
          if (d.status === 'running') {
            this.segments = [];
            this.stages = this.stages.map(s => ({...s, status: 'pending'}));
          }
          return;
        }
        if (d.type === 'progress') {
          if (d.cached && !d.message) d.message = this.$store.i18n.t('stage.cached');
          this.stages = this.stages.map(s => {
            if (s.id === d.stage) return {...s, status: d.status, message: d.message || ''};
            if (d.status === 'completed' && this._stageOrder.indexOf(s.id) < this._stageOrder.indexOf(d.stage)) return {...s, status: 'completed'};
            return s;
          });
          if (d.status === 'completed' && d.stage) {
            const label = this.stageName({id: d.stage});
            const time = d.elapsed_seconds != null ? this.fmtDuration(d.elapsed_seconds) : null;
            const parts = [label];
            if (d.cached) parts.push(this.$store.i18n.t('stage.cached'));
            if (time) parts.push(this.$store.i18n.t('stage.completed_in', {time}));
            this.stageLog.push({ stage: d.stage, text: parts.join(' · ') });
          }
          if (d.message) this.statusMessage = d.message;
          if (d.segments) {
            this.segments = d.segments;
            if (d.stage === 'asr') this.asrDone = true;
            if (d.stage === 'translate') this.translateDone = true;
          }
        }
        if (d.type === 'finished') { this.completed = true; this.result = d; this.segments = d.segments || []; this.statusMessage = ''; this._stopTimer(); es.close(); }
        if (d.type === 'error') {
          this.error = d.message;
          this.stages = this.stages.map(s => s.id === d.stage ? {...s, status: 'error'} : s);
          this._stopTimer();
          es.close();
        }
      };
      es.onerror = () => { this._stopTimer(); if (!this.completed && !this.error) this.error = this.$store.i18n.t('error.lost_connection'); es.close(); };
    }
  };
}

function settingsTab() {
  return {
    s: {{ settings_json | safe }},
    references: {{ references_audio_json | safe }},
    tts_families: {{ tts_families_json | safe }},
    audiocpp_packages: {{ audiocpp_packages_json | safe }},
    refPicker: '',
    variantPicker: '',
    subtab: 'asr',
    asrOpen: true, transOpen: true, ttsOpen: true,
    showKey: false,
    mixOpen: true, sepOpen: true, outOpen: true, pathOpen: true, ckptOpen: false,
    saving: false, saveStatus: '',
    resetConfirm: false,
    ckptStatus: '',
    mixModeDesc(v) { return this.$store.i18n.t('mix_mode.' + v); },

    init() {
      const m = /^references[\\/](.+)$/.exec(this.s.audiocpp_reference_audio || '');
      if (m && this.references.includes(m[1])) this.refPicker = m[1];
      this.syncVariantPicker();
    },

    // Variants (packages) for the currently selected audiocpp family.
    get currentVariants() {
      return this.audiocpp_packages[this.s.audiocpp_family] || [];
    },
    // Whether the currently picked variant's model file exists locally.
    // Returns null when no variant is selected (auto / custom path).
    get currentVariantInstalled() {
      if (!this.variantPicker) return null;
      const p = this.currentVariants.find(p => p.id === this.variantPicker);
      return p ? p.installed : null;
    },
    // Re-derive the variant picker from the current audiocpp_model path.
    // Called on init and whenever the family changes.
    syncVariantPicker() {
      const cur = (this.s.audiocpp_model || '').replace(/\\/g, '/');
      const pkgs = this.audiocpp_packages[this.s.audiocpp_family] || [];
      const found = pkgs.find(p => p.model_path === cur);
      this.variantPicker = found ? found.id : '';
    },
    onVariantChange(v) {
      if (!v) { this.s.audiocpp_model = ''; return; }
      const pkgs = this.audiocpp_packages[this.s.audiocpp_family] || [];
      const p = pkgs.find(p => p.id === v);
      if (p) this.s.audiocpp_model = p.model_path;
    },

    async save() {
      this.saving = true; this.saveStatus = '';
      const errPrefix = this.$store.i18n.t('save.error_prefix');
      try {
        const res = await fetch('/api/settings', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(this.s)
        });
        if (res.ok) {
          this.saveStatus = this.$store.i18n.t('save.ok');
        } else {
          const err = await res.json();
          this.saveStatus = errPrefix + (err.detail || this.$store.i18n.t('save.failed'));
        }
      } catch (e) { this.saveStatus = errPrefix + e.message; }
      this.saving = false;
    },

    async reset() {
      const errPrefix = this.$store.i18n.t('save.error_prefix');
      try {
        const res = await fetch('/api/settings/reset', { method: 'POST' });
        const data = await res.json();
        this.s = data.settings;
        this.saveStatus = this.$store.i18n.t('save.reset_ok');
      } catch (e) { this.saveStatus = errPrefix + e.message; }
    },

    async clearCheckpoints() {
      this.ckptStatus = '';
      try {
        const res = await fetch('/api/checkpoints/clear', { method: 'POST' });
        const data = await res.json();
        if (res.ok) this.ckptStatus = (data.cleared ?? 0) + ' ' + this.$store.i18n.t('ckpt.cleared');
        else this.ckptStatus = this.$store.i18n.t('ckpt.clear_failed');
      } catch (e) { this.ckptStatus = this.$store.i18n.t('ckpt.clear_failed'); }
    }
  };
}

function modelsTab() {
  return {
    groups: [],
    cacheDir: '',
    modelDir: '',
    loading: true,
    status: '',
    busy: {},
    progress: {},
    _es: {},

    fmtBytes(n) {
      if (!n) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return n.toFixed(i ? 1 : 0) + ' ' + units[i];
    },

    groupBusy(group) {
      return group.models.some(m => this.busy[m.repo_id]);
    },

    async load() {
      this.loading = true;
      this.status = '';
      try {
        const res = await fetch('/api/models');
        if (!res.ok) throw new Error((await res.json()).detail || 'failed');
        const d = await res.json();
        this.groups = d.groups;
        this.cacheDir = d.cache_dir;
        this.modelDir = d.model_dir;
      } catch (e) {
        this.status = this.$store.i18n.t('models.error_prefix') + e.message;
      }
      this.loading = false;
    },

    async download(m) {
      if (this.busy[m.repo_id]) return;
      this.busy[m.repo_id] = true;
      this.progress[m.repo_id] = { done: 0, total: 0, percent: 0 };
      this.status = '';
      try {
        const res = await fetch('/api/models/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_id: m.repo_id })
        });
        if (!res.ok) throw new Error((await res.json()).detail || 'failed');
        const { job_id } = await res.json();
        this._connect(m, job_id);
      } catch (e) {
        this.busy[m.repo_id] = false;
        this.status = this.$store.i18n.t('models.error_prefix') + e.message;
      }
    },

    _connect(m, jobId) {
      if (this._es[m.repo_id]) this._es[m.repo_id].close();
      const es = new EventSource('/api/models/download/' + jobId);
      this._es[m.repo_id] = es;
      es.onmessage = (ev) => {
        const d = JSON.parse(ev.data);
        if (d.type === 'progress' && d.repo_id === m.repo_id) {
          this.progress[m.repo_id] = { done: d.done, total: d.total, percent: Math.min(d.percent, 100) };
        }
        if (d.type === 'finished') {
          es.close();
          this.busy[m.repo_id] = false;
          this.status = this.$store.i18n.t('models.done') + ' ' + m.name;
          this.load();
        }
        if (d.type === 'error') {
          es.close();
          this.busy[m.repo_id] = false;
          this.status = this.$store.i18n.t('models.error_prefix') + d.message;
        }
      };
      es.onerror = () => {
        es.close();
        if (this.busy[m.repo_id]) {
          this.busy[m.repo_id] = false;
          this.status = this.$store.i18n.t('error.lost_connection');
        }
      };
    },

    downloadAll(group) {
      for (const m of group.models) if (!m.installed && !this.busy[m.repo_id]) this.download(m);
    },

    async remove(m) {
      if (this.busy[m.repo_id]) return;
      if (!confirm(this.$store.i18n.t('models.delete_confirm') + '\n\n' + m.name + ' — ' + m.repo_id
          + '\n' + this.$store.i18n.t('models.delete_confirm_msg'))) return;
      this.busy[m.repo_id] = true;
      this.status = '';
      try {
        const res = await fetch('/api/models/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_id: m.repo_id })
        });
        if (!res.ok) throw new Error((await res.json()).detail || 'failed');
        const d = await res.json();
        this.status = this.$store.i18n.t('models.deleted') + ' ' + this.fmtBytes(d.freed || 0);
        this.load();
      } catch (e) {
        this.status = this.$store.i18n.t('models.error_prefix') + e.message;
      }
      this.busy[m.repo_id] = false;
    }
  };
}
</script>
