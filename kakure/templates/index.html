<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kakure - ASMR Bilingual Voice Overlay</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/i18n.js"></script>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.store('i18n', {
    lang: localStorage.getItem('kakure.lang') || 'en',
    t(key, vars) {
      let s = (I18N_STRINGS[this.lang] || I18N_STRINGS.en)[key];
      if (s === undefined) s = key;
      if (vars) {
        for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(String(v));
      }
      return s;
    },
    toggle() {
      this.lang = this.lang === 'en' ? 'zh' : 'en';
      localStorage.setItem('kakure.lang', this.lang);
      document.documentElement.lang = this.lang;
    },
    init() { document.documentElement.lang = this.lang; }
  });
});
</script>
<script defer src="https://unpkg.com/alpinejs@3.14.9"></script>
<style>
  @keyframes kakure-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
    50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.08); }
  }
  .stage-running { animation: kakure-pulse 2s ease-in-out infinite; }
  [x-cloak] { display: none !important; }
  .file-drop-zone.dragover { border-color: #3b82f6; background: #eff6ff; }
</style>
</head>
<body class="bg-gray-50 min-h-screen font-sans antialiased"
      x-data="{ activeTab: 'process', ffmpegOk: true, healthChecked: false }"
      x-init="fetch('/api/health').then(r => r.json()).then(d => { ffmpegOk = d.ffmpeg !== false; healthChecked = true; }).catch(() => healthChecked = true)"
      x-cloak>

<div class="max-w-6xl mx-auto px-4 py-6">

  <!-- Header -->
  <header class="mb-6 flex items-start justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold text-gray-800">Kakure</h1>
      <p class="text-gray-500 mt-1" x-text="$store.i18n.t('app.subtitle')"></p>
    </div>
    <button type="button" @click="$store.i18n.toggle()"
            class="shrink-0 px-3 py-1.5 rounded-full border border-gray-300 bg-white text-sm text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer"
            x-text="$store.i18n.t('lang.toggle')"></button>
  </header>

  <!-- ffmpeg warning banner -->
  <div x-show="ffmpegOk === false" x-cloak
       class="mb-6 p-3 bg-amber-50 text-amber-800 rounded-md border border-amber-200 text-sm">
    <span class="font-medium" x-text="$store.i18n.t('ffmpeg.title')"></span>
    <span x-text="$store.i18n.t('ffmpeg.warn1')"></span>
    <a class="underline font-medium" href="https://ffmpeg.org/download.html" target="_blank" rel="noopener">ffmpeg.org</a>
    <span x-text="$store.i18n.t('ffmpeg.warn2')"></span>
    <button type="button" @click="ffmpegOk = true"
            class="ml-2 text-amber-700 hover:text-amber-900 underline cursor-pointer"
            x-text="$store.i18n.t('ffmpeg.dismiss')"></button>
  </div>

  <!-- Tab Nav -->
  <nav class="flex gap-0 mb-6 border-b border-gray-200">
    <button @click="activeTab = 'process'"
      :class="activeTab === 'process' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
      class="px-5 py-2.5 border-b-2 font-medium text-sm transition-colors cursor-pointer"
      x-text="$store.i18n.t('tab.process')"></button>
    <button @click="activeTab = 'transcribe'"
      :class="activeTab === 'transcribe' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
      class="px-5 py-2.5 border-b-2 font-medium text-sm transition-colors cursor-pointer"
      x-text="$store.i18n.t('tab.transcribe')"></button>
    <button @click="activeTab = 'settings'"
      :class="activeTab === 'settings' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
      class="px-5 py-2.5 border-b-2 font-medium text-sm transition-colors cursor-pointer"
      x-text="$store.i18n.t('tab.settings')"></button>
  </nav>

  <!-- ================================================================ -->
  <!-- PROCESS TAB                                                        -->
  <!-- ================================================================ -->
  <div x-show="activeTab === 'process'" x-data="processTab()" x-cloak>

    <form @submit.prevent="start" enctype="multipart/form-data"
          class="mb-6 p-6 bg-white rounded-lg border border-gray-200 shadow-sm">
      <label class="block text-sm font-medium text-gray-700 mb-2" x-text="$store.i18n.t('process.upload_label')"></label>
      <div class="flex items-center gap-3">
        <input type="file" name="file" accept="audio/*" required
               class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4
                      file:rounded-md file:border-0 file:text-sm file:font-medium
                      file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100
                      cursor-pointer" :disabled="uploading">
        <button type="submit"
                class="shrink-0 px-6 py-2 bg-blue-600 text-white rounded-md text-sm font-medium
                       hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed
                       transition-colors cursor-pointer"
                :disabled="uploading">
          <span x-show="!uploading" x-text="$store.i18n.t('process.button')"></span>
          <span x-show="uploading" class="inline-flex items-center gap-1">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            <span x-text="$store.i18n.t('process.uploading')"></span>
          </span>
        </button>
      </div>
    </form>

    <p class="text-xs text-gray-400 mb-4" x-text="$store.i18n.t('process.hint')"></p>

    <!-- Pipeline flow diagram -->
    <div class="mb-4 p-4 bg-white rounded-lg border border-gray-200 shadow-sm">
      <div class="flex items-center gap-2 flex-wrap">
        <template x-for="(stage, i) in stages" :key="stage.id">
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-2 px-3 py-2 rounded-lg border-2 min-w-[110px] transition-all duration-300"
                 :class="{
                   'border-gray-200 bg-gray-50': stage.status === 'pending',
                   'border-blue-500 bg-blue-50 stage-running': stage.status === 'running',
                   'border-green-500 bg-green-50': stage.status === 'completed',
                   'border-gray-200 bg-gray-50 border-dashed': stage.status === 'skipped',
                   'border-red-500 bg-red-50': stage.status === 'error',
                 }">
              <span class="text-lg leading-none" x-text="stage.icon"></span>
              <div>
                <div class="font-semibold text-xs"
                     :class="{
                       'text-gray-500': stage.status === 'pending',
                       'text-blue-700': stage.status === 'running',
                       'text-green-700': stage.status === 'completed',
                       'text-gray-400': stage.status === 'skipped',
                       'text-red-700': stage.status === 'error',
                     }" x-text="stageName(stage)"></div>
                <div class="text-[11px]"
                     :class="{
                       'text-gray-400': stage.status === 'pending',
                       'text-blue-500': stage.status === 'running',
                       'text-green-600': stage.status === 'completed',
                       'text-gray-300': stage.status === 'skipped',
                       'text-red-500': stage.status === 'error',
                     }" x-text="stageDesc(stage)"></div>
              </div>
            </div>
            <span x-show="i < stages.length - 1" class="text-gray-300 text-xl font-light">›</span>
          </div>
        </template>
      </div>
    </div>

    <!-- Status / Error -->
    <div x-show="statusMessage && !error" class="mb-4 p-3 bg-blue-50 text-blue-700 rounded-md text-sm"
         x-text="statusMessage"></div>
    <div x-show="error" class="mb-4 p-3 bg-red-50 text-red-700 rounded-md text-sm whitespace-pre-line" x-text="error"></div>

    <!-- Results -->
    <div x-show="completed" class="space-y-4" x-transition>
      <div class="p-4 bg-green-50 rounded-md border border-green-200">
        <p class="text-sm text-green-700">
          <span x-text="$store.i18n.t('process.done')"></span>
          <span x-text="$store.i18n.t('process.duration')"></span>: <span x-text="result.duration.toFixed(1)"></span>s |
          <span x-text="$store.i18n.t('process.segments')"></span>: <span x-text="result.segments_count ?? result.segments?.length"></span>
          <span x-show="result.vocals_separated"> | <span x-text="$store.i18n.t('process.vocals_separated')"></span></span>
        </p>
      </div>
      <div class="flex gap-3">
        <a :href="'/api/process/' + jobId + '/result'"
           class="inline-flex items-center gap-1 px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700 transition-colors no-underline"
           x-text="$store.i18n.t('process.download_audio')"></a>
        <a :href="'/api/process/' + jobId + '/srt'"
           class="inline-flex items-center gap-1 px-4 py-2 bg-gray-600 text-white rounded-md text-sm font-medium hover:bg-gray-700 transition-colors no-underline"
           x-text="$store.i18n.t('process.download_srt')"></a>
      </div>

      <!-- Segments table -->
      <div class="overflow-x-auto bg-white rounded-lg border border-gray-200 shadow-sm" x-show="segments.length">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('process.col.id')"></th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('process.col.start')"></th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('process.col.end')"></th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('process.col.japanese')"></th>
              <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('process.col.chinese')"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <template x-for="seg in segments" :key="seg.id">
              <tr class="hover:bg-gray-50">
                <td class="px-3 py-2 text-gray-600" x-text="seg.id"></td>
                <td class="px-3 py-2 text-gray-600" x-text="seg.start.toFixed(2)"></td>
                <td class="px-3 py-2 text-gray-600" x-text="seg.end.toFixed(2)"></td>
                <td class="px-3 py-2 text-gray-800 max-w-md" x-text="seg.original_text"></td>
                <td class="px-3 py-2 text-gray-800 max-w-md" x-text="seg.translated_text"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- ================================================================ -->
  <!-- TRANSCRIBE TAB                                                    -->
  <!-- ================================================================ -->
  <div x-show="activeTab === 'transcribe'" x-data="transcribeTab()" x-cloak>

    <form @submit.prevent="start" enctype="multipart/form-data"
          class="mb-6 p-6 bg-white rounded-lg border border-gray-200 shadow-sm">
      <label class="block text-sm font-medium text-gray-700 mb-2" x-text="$store.i18n.t('transcribe.upload_label')"></label>
      <div class="flex items-center gap-3">
        <input type="file" name="file" accept="audio/*" required
               class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4
                      file:rounded-md file:border-0 file:text-sm file:font-medium
                      file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100
                      cursor-pointer" :disabled="uploading">
        <button type="submit"
                class="shrink-0 px-6 py-2 bg-blue-600 text-white rounded-md text-sm font-medium
                       hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed
                       transition-colors cursor-pointer"
                :disabled="uploading">
          <span x-show="!uploading" x-text="$store.i18n.t('transcribe.button')"></span>
          <span x-show="uploading" class="inline-flex items-center gap-1">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            <span x-text="$store.i18n.t('transcribe.uploading')"></span>
          </span>
        </button>
      </div>
    </form>

    <p class="text-xs text-gray-400 mb-4" x-text="$store.i18n.t('transcribe.hint')"></p>

    <!-- Pipeline flow diagram -->
    <div class="mb-4 p-4 bg-white rounded-lg border border-gray-200 shadow-sm">
      <div class="flex items-center gap-2 flex-wrap">
        <template x-for="(stage, i) in stages" :key="stage.id">
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-2 px-3 py-2 rounded-lg border-2 min-w-[110px] transition-all duration-300"
                 :class="{
                   'border-gray-200 bg-gray-50': stage.status === 'pending',
                   'border-blue-500 bg-blue-50 stage-running': stage.status === 'running',
                   'border-green-500 bg-green-50': stage.status === 'completed',
                   'border-red-500 bg-red-50': stage.status === 'error',
                 }">
              <span class="text-lg leading-none" x-text="stage.icon"></span>
              <div>
                <div class="font-semibold text-xs"
                     :class="{
                       'text-gray-500': stage.status === 'pending',
                       'text-blue-700': stage.status === 'running',
                       'text-green-700': stage.status === 'completed',
                       'text-red-700': stage.status === 'error',
                     }" x-text="stageName(stage)"></div>
                <div class="text-[11px]"
                     :class="{
                       'text-gray-400': stage.status === 'pending',
                       'text-blue-500': stage.status === 'running',
                       'text-green-600': stage.status === 'completed',
                       'text-red-500': stage.status === 'error',
                     }" x-text="stageDesc(stage)"></div>
              </div>
            </div>
            <span x-show="i < stages.length - 1" class="text-gray-300 text-xl font-light">›</span>
          </div>
        </template>
      </div>
    </div>

    <!-- Info / Error -->
    <div x-show="infoText && !error" class="mb-4 p-3 bg-blue-50 text-blue-700 rounded-md text-sm"
         x-text="infoText"></div>
    <div x-show="error" class="mb-4 p-3 bg-red-50 text-red-700 rounded-md text-sm whitespace-pre-line" x-text="error"></div>

    <!-- Transcription table -->
    <div x-show="segments.length" class="overflow-x-auto bg-white rounded-lg border border-gray-200 shadow-sm" x-transition>
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('transcribe.col.id')"></th>
            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('transcribe.col.start')"></th>
            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('transcribe.col.end')"></th>
            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase" x-text="$store.i18n.t('transcribe.col.text')"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <template x-for="seg in segments" :key="seg.id">
            <tr class="hover:bg-gray-50">
              <td class="px-3 py-2 text-gray-600" x-text="seg.id"></td>
              <td class="px-3 py-2 text-gray-600" x-text="seg.start?.toFixed(2)"></td>
              <td class="px-3 py-2 text-gray-600" x-text="seg.end?.toFixed(2)"></td>
              <td class="px-3 py-2 text-gray-800 max-w-xl" x-text="seg.text"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

  </div>

  <!-- ================================================================ -->
  <!-- SETTINGS TAB                                                      -->
  <!-- ================================================================ -->
  <div x-show="activeTab === 'settings'" x-data="settingsTab()" x-cloak>

    <!-- Settings subtab navigation -->
    <nav class="flex gap-2 mb-4 flex-wrap">
      <button @click="subtab = 'asr'" type="button"
              :class="subtab === 'asr' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
              class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors cursor-pointer"
              x-text="$store.i18n.t('subtab.asr')"></button>
      <button @click="subtab = 'translator'" type="button"
              :class="subtab === 'translator' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
              class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors cursor-pointer"
              x-text="$store.i18n.t('subtab.translator')"></button>
      <button @click="subtab = 'tts'" type="button"
              :class="subtab === 'tts' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
              class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors cursor-pointer"
              x-text="$store.i18n.t('subtab.tts')"></button>
      <button @click="subtab = 'mixing'" type="button"
              :class="subtab === 'mixing' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
              class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors cursor-pointer"
              x-text="$store.i18n.t('subtab.mixing')"></button>
      <button @click="subtab = 'output'" type="button"
              :class="subtab === 'output' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
              class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors cursor-pointer"
              x-text="$store.i18n.t('subtab.output')"></button>
    </nav>

    <!-- ==================== ASR subtab ==================== -->
    <div x-show="subtab === 'asr'" class="max-w-2xl space-y-4">

        <!-- ASR Settings -->
        <section class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
          <button @click="asrOpen = !asrOpen" type="button"
                  class="w-full flex items-center justify-between px-4 py-3 bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer">
            <span class="text-sm font-medium text-gray-700" x-text="$store.i18n.t('asr.title')"></span>
            <svg :class="asrOpen ? 'rotate-180' : ''" class="w-4 h-4 text-gray-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div x-show="asrOpen" class="px-4 py-3 space-y-3">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1" x-text="$store.i18n.t('asr.backend')"></label>
              <select x-model="s.asr_backend" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
                {% for b in asr_backends %}<option value="{{ b.value }}">{{ b.label }}</option>{% endfor %}
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1" x-text="$store.i18n.t('asr.device')"></label>
              <select x-model="s.whisper_device" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm">
                <option value="cpu">cpu</option><option value="cuda">cuda</option>
              </select>
            </div>
            <!-- faster-whisper fields -->
            <template x-if="s.asr_backend === 'faster-whisper'">
              <div class="space-y-3">
                <div>
                  <label class="block text-xs font-medium text-gray-500 mb-1" x-text="$store.i18n.t('asr.whisper_model')"></label>
                  <select x-model="s.whisper_model" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm">
                    {% for m in whisper_models %}<option value="{{ m.value }}">{{ m.label }}</option>{% endfor %}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-500 mb-1" x-text="$store.i18n.t('asr.compute_type')"></label>
                  <input x-model="s.whisper_compute_type" type="text" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm" placeholder="int8">
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-500 mb-1" x-text="$store.i18n.t('asr.language')"></label>
                  <input x-model="s.whisper_language" type="text" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm" placeholder="ja">
                </div>
                <div class="flex gap-4">
                  <div class="flex-1">
                    <label class="block text-xs font-medium text-gray-500 mb-1" x-text="$store.i18n.t('asr.beam_size')"></label>
                    <input x-model.number="s.whisper_beam_size" type="number" min="1" max="20" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm">
                  </div>
                  <div class="flex items-end pb-1">
                    <label class="flex items-center gap-1.5 text-sm cursor-pointer">
                      <input x-model="s.whisper_vad_filter" type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                      <span x-text="$store.i18n.t('asr.vad')"></span>
                    </label>
                  </div>
                </div>
              </div>
            </template>
            <!-- kotoba-whisper fields -->
            <template x-if="s.asr_backend === 'kotoba-whisper'">
              <div class="space-y-3">
                <div>
                  <label class="block text-xs font-medium text-gray-500 mb-1" x-text="$store.i18n.t('asr.kotoba_model')"></label>
                  <select x-model="s.kotoba_whisper_model" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm">
                    {% for m in kotoba_models %}<option value="{{ m.value }}">{{ m.label }}</option>{% endfor %}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-500 mb-1" x-text="$store.i18n.t('asr.chunk_length')"></label>
                  <input x-model.number="s.kotoba_whisper_chunk_length_s" type="number" min="5" max="60" class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm">
                </div>
              </div>
            </template>
          </div>
        </section>

    </div>

    <!-- ==================== Translator subtab ==================== -->
    <div x-show="subtab === 'translator'" class="max-w-2xl space-y-4">

        <!-- Translation Settings -->
        <section class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
          <button @click="transOpen = !transOpen" type="button"
                  class="w-full flex items-center justify-between px-4 py-3 bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer">

<script>
function processTab() {
  return {
    jobId: null,
    stages: {{ pipeline_stages_json | safe }}.map(s => ({...s, status: 'pending'})),
    statusMessage: '',
    error: null,
    completed: false,
    result: null,
    segments: [],
    uploading: false,
    _stageOrder: null,
    _es: null,

    init() {
      this._stageOrder = this.stages.map(s => s.id);
    },

    stageName(stage) { return this.$store.i18n.t('stage.' + stage.id + '.name'); },
    stageDesc(stage) {
      return this.$store.i18n.t('stage.' + stage.id + '.desc')
        + (stage.status === 'completed' ? this.$store.i18n.t('stages.completed')
          : stage.status === 'running' ? this.$store.i18n.t('stages.running')
          : stage.status === 'error' ? this.$store.i18n.t('stages.error') : '');
    },

    async start(event) {
      this.uploading = true; this.error = null; this.completed = false;
      this.result = null; this.segments = [];
      this.stages = this.stages.map(s => ({...s, status: 'pending'}));
      this.statusMessage = '';
      const formData = new FormData(event.target);
      try {
        const res = await fetch('/api/process', { method: 'POST', body: formData });
        if (!res.ok) throw new Error((await res.json()).detail || this.$store.i18n.t('error.upload_failed'));
        const { job_id } = await res.json();
        this.jobId = job_id;
      } catch (e) { this.error = e.message; this.uploading = false; return; }
      this.uploading = false;
      this.connectSSE();
    },

    connectSSE() {
      if (this._es) this._es.close();
      const es = new EventSource('/api/process/' + this.jobId);
      this._es = es;
      es.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'heartbeat') return;
        if (d.type === 'progress') {
          this.stages = this.stages.map(s => {
            if (s.id === d.stage) return {...s, status: d.status, message: d.message || ''};
            if (d.status === 'completed' && this._stageOrder.indexOf(s.id) < this._stageOrder.indexOf(d.stage)) return {...s, status: 'completed'};
            return s;
          });
          if (d.message) this.statusMessage = d.message;
        }
        if (d.type === 'finished') { this.completed = true; this.result = d; this.segments = d.segments || []; this.statusMessage = ''; es.close(); }
        if (d.type === 'error') {
          this.error = d.message;
          this.stages = this.stages.map(s => s.id === d.stage ? {...s, status: 'error'} : s);
          es.close();
        }
      };
      es.onerror = () => { if (!this.completed && !this.error) this.error = this.$store.i18n.t('error.lost_connection'); es.close(); };
    }
  };
}

function transcribeTab() {
  return {
    jobId: null,
    stages: {{ transcribe_stages_json | safe }}.map(s => ({...s, status: 'pending'})),
    infoText: '',
    error: null,
    segments: [],
    uploading: false,
    _stageOrder: null,
    _es: null,

    init() { this._stageOrder = this.stages.map(s => s.id); },

    stageName(stage) { return this.$store.i18n.t('stage.' + stage.id + '.name'); },
    stageDesc(stage) {
      return this.$store.i18n.t('stage.' + stage.id + '.desc')
        + (stage.status === 'completed' ? this.$store.i18n.t('stages.completed')
          : stage.status === 'running' ? this.$store.i18n.t('stages.running')
          : stage.status === 'error' ? this.$store.i18n.t('stages.error') : '');
    },

    async start(event) {
      this.uploading = true; this.error = null; this.segments = [];
      this.stages = this.stages.map(s => ({...s, status: 'pending'}));
      this.infoText = '';
      const formData = new FormData(event.target);
      try {
        const res = await fetch('/api/transcribe', { method: 'POST', body: formData });
        if (!res.ok) throw new Error((await res.json()).detail || this.$store.i18n.t('error.upload_failed'));
        const { job_id } = await res.json();
        this.jobId = job_id;
      } catch (e) { this.error = e.message; this.uploading = false; return; }
      this.uploading = false;
      this.connectSSE();
    },

    connectSSE() {
      if (this._es) this._es.close();
      const es = new EventSource('/api/transcribe/' + this.jobId);
      this._es = es;
      es.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'heartbeat') return;
        if (d.type === 'progress') {
          this.stages = this.stages.map(s => {
            if (s.id === d.stage) return {...s, status: d.status};
            if (d.status === 'completed' && this._stageOrder.indexOf(s.id) < this._stageOrder.indexOf(d.stage)) return {...s, status: 'completed'};
            return s;
          });
        }
        if (d.type === 'finished') {
          this.segments = d.segments || [];
          this.infoText = this.$store.i18n.t('transcribe.info', {
            lang: d.language,
            pct: (d.language_probability * 100).toFixed(0),
            dur: d.duration?.toFixed(1),
            count: d.segments?.length || 0
          });
          es.close();
        }
        if (d.type === 'error') { this.error = d.message; es.close(); }
      };
      es.onerror = () => { if (!this.error) this.error = this.$store.i18n.t('error.lost_connection'); es.close(); };
    }
  };
}

function settingsTab() {
  return {
    s: {{ settings_json | safe }},
    voices: {{ chinese_voices_json | safe }},
    subtab: 'asr',
    asrOpen: true, transOpen: true, ttsOpen: true,
    mixOpen: true, sepOpen: true, outOpen: true, pathOpen: true,
    saving: false, saveStatus: '',
    mixModeDesc(v) { return this.$store.i18n.t('mix_mode.' + v); },

    async save() {
      this.saving = true; this.saveStatus = '';
      const errPrefix = this.$store.i18n.t('save.error_prefix');
      try {
        const res = await fetch('/api/settings', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(this.s)
        });
        if (res.ok) {
          this.saveStatus = this.$store.i18n.t('save.ok');
        } else {
          const err = await res.json();
          this.saveStatus = errPrefix + (err.detail || this.$store.i18n.t('save.failed'));
        }
      } catch (e) { this.saveStatus = errPrefix + e.message; }
      this.saving = false;
    },

    async reset() {
      const errPrefix = this.$store.i18n.t('save.error_prefix');
      try {
        const res = await fetch('/api/settings/reset', { method: 'POST' });
        const data = await res.json();
        this.s = data.settings;
        this.saveStatus = this.$store.i18n.t('save.reset_ok');
      } catch (e) { this.saveStatus = errPrefix + e.message; }
    }
  };
}
</script>

</body>
</html>
